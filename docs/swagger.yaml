      - description: 响应类型（code）
        in: query
        name: response_type
        required: true
        type: string
      - description: 客户端 ID
        in: query
        name: client_id
        required: true
        type: string
      - description: 回调地址
        in: query
        name: redirect_uri
        required: true
        type: string
      - description: PKCE code_challenge
        in: query
        name: code_challenge
        required: true
        type: string
      - description: PKCE 方法（S256）
        in: query
        name: code_challenge_method
        required: true
        type: string
      - description: 客户端状态
        in: query
        name: state
        type: string
      - description: 作用域
        in: query
        name: scope
        type: string
      - description: RFC 8707 资源标识
        in: query
        name: resource
        type: string
      produces:
      - text/plain
      responses:
        "302":
          description: 重定向到前端授权页
          schema:
            type: string
        "400":
          description: 授权请求无效（无法安全重定向）
          schema:
            type: string
      summary: '[公开] OAuth 授权端点'
      tags:
      - OAuth接口
