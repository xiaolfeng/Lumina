definitions:
  apikey.ApikeyItem:
    properties:
      created_at:
        description: 创建时间
        type: string
      description:
        description: 描述
        type: string
      expires_at:
        description: 过期时间
        type: string
      id:
        description: API Key ID
        type: integer
      is_active:
        description: 是否启用
        type: boolean
      key:
        description: 脱敏密钥
        type: string
      key_prefix:
        description: 密钥前缀
        type: string
      last_used_at:
        description: 最后使用时间
        type: string
      name:
        description: API Key名称
        type: string
    type: object
  apikey.CreateRequest:
    properties:
      description:
        description: 描述
        type: string
      expires_at:
        description: 过期时间（NULL=永不过期）
        type: string
      name:
        description: API Key名称
        maxLength: 64
        minLength: 1
        type: string
    required:
    - name
    type: object
  apikey.CreateResponse:
    properties:
      created_at:
        description: 创建时间（手动映射，BaseEntity.CreatedAt 的 json:"-"）
        type: string
      description:
        description: 描述
        type: string
      expires_at:
        description: 过期时间
        type: string
      id:
        description: API Key ID
        type: integer
      is_active:
        description: 是否启用
        type: boolean
      key:
        description: 完整密钥（仅此一次）
        type: string
      key_prefix:
        description: 密钥前缀
        type: string
      name:
        description: API Key名称
        type: string
    type: object
  apikey.DetailResponse:
    properties:
      created_at:
        description: 创建时间
        type: string
      description:
        description: 描述
        type: string
      expires_at:
        description: 过期时间
        type: string
      id:
        description: API Key ID
        type: integer
      is_active:
        description: 是否启用
        type: boolean
      key:
        description: 脱敏密钥（前8+...+后8）
        type: string
      key_prefix:
        description: 密钥前缀
        type: string
      last_used_at:
        description: 最后使用时间
        type: string
      name:
        description: API Key名称
        type: string
    type: object
  apikey.ResetResponse:
    properties:
      created_at:
        description: 创建时间
        type: string
      description:
        description: 描述
        type: string
      expires_at:
        description: 过期时间
        type: string
      id:
        description: API Key ID
        type: integer
      is_active:
        description: 是否启用
        type: boolean
      key:
        description: 新完整密钥（仅此一次）
        type: string
      key_prefix:
        description: 密钥前缀
        type: string
      name:
        description: API Key名称
        type: string
    type: object
  apikey.UpdateRequest:
    properties:
      description:
        description: 描述（指针区分零值和未传）
        type: string
      expires_at:
        description: 过期时间
        type: string
      is_active:
        description: 是否启用（指针区分零值和未传）
        type: boolean
      name:
        description: API Key名称
        type: string
    type: object
  auth.InitializeRequest:
    properties:
      email:
        description: 邮箱地址
        type: string
      password:
        description: 登录密码
        maxLength: 64
        minLength: 6
        type: string
      setup_token:
        description: 一次性初始化令牌（对应 XLF_INITIALIZE_TOKEN，可选）
        maxLength: 128
        type: string
      username:
        description: 用户名
        maxLength: 32
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  auth.LoginRequest:
    properties:
      account:
        description: 账号（用户名或邮箱）
        type: string
      password:
        description: 登录密码
        type: string
    required:
    - account
    - password
    type: object
  auth.RefreshRequest:
    properties:
      refresh_token:
        description: 刷新令牌
        type: string
    required:
    - refresh_token
    type: object
  auth.StatusResponse:
    properties:
      is_initial:
        description: 系统是否为初始状态（true=未初始化）
        type: boolean
    type: object
  auth.TokenResponse:
    properties:
      access_token:
        description: 访问令牌
        type: string
      expires_in:
        description: 过期时间（秒）
        type: integer
      refresh_token:
        description: 刷新令牌
        type: string
    type: object
  biometric.AvailabilityResponse:
    properties:
      is_available:
        description: 是否可用（已注册凭证）
        type: boolean
    type: object
  biometric.LoginFinishRequest:
    properties:
      credential:
        description: CredentialAssertion JSON
        type: object
      session_token:
        description: 会话令牌
        type: string
    required:
    - credential
    - session_token
    type: object
  biometric.LoginFinishResponse:
    properties:
      access_token:
        description: 访问令牌
        type: string
      expires_at:
        description: 过期时间戳
        type: integer
      refresh_token:
        description: 刷新令牌
        type: string
    type: object
  biometric.LoginStartResponse:
    properties:
      options:
        description: WebAuthn PublicKeyCredentialRequestOptions
        type: object
      session_token:
        description: 会话令牌
        type: string
    type: object
  biometric.RegisterFinishRequest:
    properties:
      credential:
        description: CredentialAttestation JSON
        type: object
      device_name:
        description: 设备名称
        maxLength: 128
        type: string
      session_token:
        description: 会话令牌
        type: string
    required:
    - credential
    - device_name
    - session_token
    type: object
  biometric.RegisterFinishResponse:
    properties:
      message:
        description: 消息
        type: string
      success:
        description: 是否成功
        type: boolean
    type: object
  biometric.RegisterStartRequest:
    properties:
      device_name:
        description: 设备名称
        maxLength: 128
        type: string
    required:
    - device_name
    type: object
  biometric.RegisterStartResponse:
    properties:
      options:
        description: WebAuthn PublicKeyCredentialCreationOptions（透传 JSON）
        type: object
      session_token:
        description: 会话令牌（关联 Redis challenge）
        type: string
    type: object
  common.BaseResponse:
    properties:
      code:
        type: integer
      context:
        type: string
      data: {}
      error_message:
        type: string
      message:
        type: string
      output:
        type: string
      overhead:
        type: integer
    type: object
  dashboard.OverviewResponse:
    properties:
      preview:
        allOf:
        - $ref: '#/definitions/dashboard.PreviewStats'
        description: 预览统计
      projects:
        description: 项目总数
        type: integer
      qa:
        allOf:
        - $ref: '#/definitions/dashboard.QaStats'
        description: 问答统计
      recent_previews:
        description: 最近预览列表
        items:
          $ref: '#/definitions/dashboard.RecentPreviewItem'
        type: array
      repowiki:
        allOf:
        - $ref: '#/definitions/dashboard.RepoWikiStats'
        description: RepoWiki 统计
      tokens:
        allOf:
        - $ref: '#/definitions/dashboard.TokenStats'
        description: 令牌统计
    type: object
  dashboard.PreviewStats:
    properties:
      active:
        description: 活跃会话
        type: integer
      files:
        description: 文件总数
        type: integer
      total:
        description: 预览会话总数
        type: integer
    type: object
  dashboard.QaStats:
    properties:
      active:
        description: 活跃会话
        type: integer
      deleted:
        description: 已删除会话
        type: integer
      expired:
        description: 已归档（过期）会话
        type: integer
      pending_questions:
        description: 待回答问题总数
        type: integer
      total:
        description: 会话总数
        type: integer
    type: object
  dashboard.RecentPreviewItem:
    properties:
      file_count:
        description: 文件数
        type: integer
      hash:
        description: 访问哈希
        type: string
      id:
        description: 会话ID
        type: string
      status:
        description: 会话状态
        type: string
      title:
        description: 会话标题
        type: string
      updated_at:
        description: 更新时间
        type: string
    type: object
  dashboard.RepoWikiStats:
    properties:
      completed:
        description: 已完成版本数
        type: integer
      configs:
        description: 配置总数
        type: integer
      generating:
        description: 生成中版本数
        type: integer
      versions:
        description: 版本总数
        type: integer
    type: object
  dashboard.TokenStats:
    properties:
      active:
        description: 活跃令牌数
        type: integer
      total:
        description: 令牌总数
        type: integer
    type: object
  health.PingResponse:
    properties:
      app:
        type: string
      database_ready:
        type: boolean
      redis_ready:
        type: boolean
      timestamp:
        type: integer
      version:
        type: string
    type: object
  llm.AgentModelAssignment:
    properties:
      model_id:
        description: 关联模型ID(nil表示未分配)
        type: integer
      model_name:
        description: 模型显示名称(nil表示未分配)
        type: string
      role:
        description: Agent角色
        type: string
    type: object
  llm.AgentModelAssignmentsResponse:
    properties:
      assignments:
        description: 角色分配列表
        items:
          $ref: '#/definitions/llm.AgentModelAssignment'
        type: array
      module:
        description: 模块标识（如 repowiki）
        type: string
    type: object
  llm.CreateModelRequest:
    properties:
      context_window:
        description: 模型上下文窗口大小
        type: integer
      description:
        description: 描述说明
        type: string
      display_name:
        description: 显示名称
        type: string
      max_tokens:
        description: 单次响应最大输出Token数
        type: integer
      model_name:
        description: 模型标识
        type: string
      provider_id:
        description: 关联Provider ID
        type: integer
      temperature:
        description: 生成温度
        type: number
      thinking_effort:
        description: 思考强度(none/low/medium/high,空=不启用)
        type: string
    required:
    - display_name
    - model_name
    - provider_id
    type: object
  llm.CreateProviderRequest:
    properties:
      api_key:
        description: API密钥(明文，后端加密存储)
        type: string
      base_url:
        description: 自定义API端点
        type: string
      description:
        description: 描述说明
        type: string
      name:
        description: Provider名称
        type: string
      protocol:
        description: 协议类型(openai/anthropic)
        type: string
    required:
    - api_key
    - name
    - protocol
    type: object
  llm.ModelDetailResponse:
    properties:
      context_window:
        description: 模型上下文窗口大小
        type: integer
      created_at:
        description: 创建时间
        type: string
      description:
        description: 描述说明
        type: string
      display_name:
        description: 显示名称
        type: string
      id:
        description: 模型 ID
        type: integer
      is_active:
        description: 是否启用
        type: boolean
      max_tokens:
        description: 单次响应最大输出Token数
        type: integer
      model_name:
        description: 模型标识
        type: string
      provider_id:
        description: 关联Provider ID
        type: integer
      temperature:
        description: 生成温度
        type: number
      thinking_effort:
        description: 思考强度
        type: string
      updated_at:
        description: 更新时间
        type: string
    type: object
  llm.ModelListItem:
    properties:
      context_window:
        description: 模型上下文窗口大小
        type: integer
      created_at:
        description: 创建时间
        type: string
      description:
        description: 描述说明
        type: string
      display_name:
        description: 显示名称
        type: string
      id:
        description: 模型 ID
        type: integer
      is_active:
        description: 是否启用
        type: boolean
      max_tokens:
        description: 单次响应最大输出Token数
        type: integer
      model_name:
        description: 模型标识
        type: string
      provider_id:
        description: 关联Provider ID
        type: integer
      temperature:
        description: 生成温度
        type: number
      thinking_effort:
        description: 思考强度
        type: string
    type: object
  llm.ProviderDetailResponse:
    properties:
      base_url:
        description: 自定义API端点
        type: string
      created_at:
        description: 创建时间
        type: string
      description:
        description: 描述说明
        type: string
      has_key:
        description: 是否已设置密钥
        type: boolean
      id:
        description: Provider ID
        type: integer
      is_active:
        description: 是否启用
        type: boolean
      name:
        description: Provider名称
        type: string
      protocol:
        description: 协议类型
        type: string
      updated_at:
        description: 更新时间
        type: string
    type: object
  llm.ProviderListItem:
    properties:
      base_url:
        description: 自定义API端点
        type: string
      created_at:
        description: 创建时间
        type: string
      description:
        description: 描述说明
        type: string
      has_key:
        description: 是否已设置密钥
        type: boolean
      id:
        description: Provider ID
        type: integer
      is_active:
        description: 是否启用
        type: boolean
      name:
        description: Provider名称
        type: string
      protocol:
        description: 协议类型
        type: string
    type: object
  llm.UpdateAgentModelRequest:
    properties:
      model_id:
        description: 模型ID
        type: integer
    required:
    - model_id
    type: object
  llm.UpdateModelRequest:
    properties:
      context_window:
        description: 模型上下文窗口大小
        type: integer
      description:
        description: 描述说明
        type: string
      display_name:
        description: 显示名称
        type: string
      is_active:
        description: 是否启用
        type: boolean
      max_tokens:
        description: 单次响应最大输出Token数
        type: integer
      model_name:
        description: 模型标识
        type: string
      provider_id:
        description: 关联Provider ID
        type: integer
      temperature:
        description: 生成温度
        type: number
      thinking_effort:
        description: 思考强度(none/low/medium/high,空=不启用)
        type: string
    type: object
  llm.UpdateProviderRequest:
    properties:
      api_key:
        description: API密钥(空时不更新)
        type: string
      base_url:
        description: 自定义API端点
        type: string
      description:
        description: 描述说明
        type: string
      is_active:
        description: 是否启用
        type: boolean
      name:
        description: Provider名称
        type: string
      protocol:
        description: 协议类型
        type: string
    type: object
  oauth.AuthorizationServerMetadata:
    properties:
      authorization_endpoint:
        description: 授权端点
        type: string
      code_challenge_methods_supported:
        description: 支持的 PKCE 方法
        items:
          type: string
        type: array
      grant_types_supported:
        description: 支持的授权方式
        items:
          type: string
        type: array
      issuer:
        description: 签发者标识（站点根地址）
        type: string
      registration_endpoint:
        description: 动态注册端点
        type: string
      response_types_supported:
        description: 支持的响应类型
        items:
          type: string
        type: array
      scopes_supported:
        description: 支持的作用域
        items:
          type: string
        type: array
      token_endpoint:
        description: 令牌端点
        type: string
      token_endpoint_auth_methods_supported:
        description: 令牌端点认证方式
        items:
          type: string
        type: array
    type: object
  oauth.ConsentDetail:
    properties:
      client_name:
        description: 请求授权的客户端名称
        type: string
      scope:
        description: 请求的作用域
        type: string
    type: object
  oauth.ConsentRedirect:
    properties:
      redirect:
        description: 客户端回调地址
        type: string
    type: object
  oauth.ConsentRequest:
    properties:
      approve:
        description: 是否同意授权
        type: boolean
      authorize_id:
        description: 授权请求 ID
        type: string
    required:
    - authorize_id
    type: object
  oauth.ProtectedResourceMetadata:
    properties:
      authorization_servers:
        description: 授权服务器 issuer 列表
        items:
          type: string
        type: array
      bearer_methods_supported:
        description: Bearer 传递方式
        items:
          type: string
        type: array
      resource:
        description: 资源标识（MCP 端点完整 URL）
        type: string
      resource_documentation:
        description: 资源文档地址
        type: string
      scopes_supported:
        description: 支持的作用域
        items:
          type: string
        type: array
    type: object
  oauth.RegisterRequest:
    properties:
      client_name:
        description: 客户端名称
        type: string
      grant_types:
        description: 请求的授权方式（忽略，恒为 authorization_code）
        items:
          type: string
        type: array
      redirect_uris:
        description: 回调地址列表（精确匹配）
        items:
          type: string
        minItems: 1
        type: array
      response_types:
        description: 请求的响应类型（忽略，恒为 code）
        items:
          type: string
        type: array
      scope:
        description: 请求作用域（忽略，恒为 mcp）
        type: string
      token_endpoint_auth_method:
        description: 令牌端点认证方式（忽略，恒为 none）
        type: string
    required:
    - redirect_uris
    type: object
  oauth.RegisterResponse:
    properties:
      client_id:
        description: 客户端 ID（雪花 ID 十进制字符串）
        type: string
      client_id_issued_at:
        description: 签发时间（Unix 秒）
        type: integer
      client_name:
        description: 客户端名称
        type: string
      grant_types:
        description: 授权方式
        items:
          type: string
        type: array
      redirect_uris:
        description: 回调地址列表
        items:
          type: string
        type: array
      response_types:
        description: 响应类型
        items:
          type: string
        type: array
      scope:
        description: 授予作用域
        type: string
      token_endpoint_auth_method:
        description: 令牌端点认证方式
        type: string
    type: object
  oauth.TokenErrorResponse:
    properties:
      error:
        description: 错误码（invalid_request / invalid_client / invalid_grant 等）
        type: string
      error_description:
        description: 错误描述
        type: string
    type: object
  oauth.TokenResponse:
    properties:
      access_token:
        description: 访问令牌（lum_at_ 前缀）
        type: string
      expires_in:
        description: 访问令牌有效期（秒）
        type: integer
      refresh_token:
        description: 刷新令牌（lum_rt_ 前缀）
        type: string
      scope:
        description: 授予作用域
        type: string
      token_type:
        description: 令牌类型，恒为 Bearer
        type: string
    type: object
  pages.ForkPageRequest:
    properties:
      version_id:
        description: 可选，默认当前生效版本
        type: integer
    type: object
  pages.ForkPageResponse:
    properties:
      preview_url:
        description: 工作台路径
        type: string
      session:
        allOf:
        - $ref: '#/definitions/preview.PreviewSessionResponse'
        description: 新预览会话
    type: object
  pages.PageAuthCheckResponse:
    properties:
      authenticated:
        description: Cookie 是否有效
        type: boolean
      password_required:
        description: 是否需要密码
        type: boolean
    type: object
  pages.PageFileResponse:
    properties:
      created_at:
        description: 创建时间
        type: string
      filename:
        description: 扁平文件名
        type: string
      id:
        description: 文件 ID
        type: integer
      mime_type:
        description: MIME 类型
        type: string
      size:
        description: 字节数
        type: integer
      updated_at:
        description: 更新时间
        type: string
      version_id:
        description: 所属版本 ID
        type: integer
    type: object
  pages.PageListResponse:
    properties:
      items:
        description: 页面列表
        items:
          $ref: '#/definitions/pages.PageResponse'
        type: array
      total:
        description: 总数量
        type: integer
    type: object
  pages.PagePublicMetaResponse:
    properties:
      files:
        description: 文件清单（不含正文）
        items:
          $ref: '#/definitions/pages.PageFileResponse'
        type: array
      page:
        allOf:
        - $ref: '#/definitions/pages.PageResponse'
        description: 页面元信息
      version:
        allOf:
        - $ref: '#/definitions/pages.PageVersionResponse'
        description: 当前渲染版本
    type: object
  pages.PageResponse:
    properties:
      access_mode:
        description: public / password
        type: string
      created_at:
        description: 创建时间
        type: string
      description:
        description: 页面描述
        type: string
      id:
        description: 页面 ID
        type: integer
      latest_version:
        description: 当前线上版本号
        type: string
      latest_version_id:
        description: 当前线上生效版本指针
        type: integer
      page_url:
        description: 对外访问路径
        type: string
      project_id:
        description: 所属项目 ID
        type: integer
      project_name:
        description: 所属项目名称
        type: string
      slug:
        description: 项目内访问标识
        type: string
      status:
        description: published / archived
        type: string
      title:
        description: 页面显示标题
        type: string
      updated_at:
