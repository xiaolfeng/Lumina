info:
  contact: {}
paths:
  /.well-known/oauth-authorization-server:
    get:
      description: 按 RFC 8414 输出 /.well-known/oauth-authorization-server，含授权/令牌/注册端点与
        PKCE 能力
      produces:
      - application/json
      responses:
        "200":
          description: 授权服务器元数据
          schema:
            $ref: '#/definitions/oauth.AuthorizationServerMetadata'
      summary: '[公开] OAuth 授权服务器元数据'
      tags:
      - OAuth接口
  /.well-known/oauth-protected-resource:
    get:
      description: 按 RFC 9728 输出 /.well-known/oauth-protected-resource，供 MCP 客户端发现授权服务器
      produces:
      - application/json
      responses:
        "200":
          description: 资源元数据
          schema:
            $ref: '#/definitions/oauth.ProtectedResourceMetadata'
      summary: '[公开] OAuth 受保护资源元数据'
      tags:
      - OAuth接口
  /.well-known/skills/{name}/SKILL.md:
    get:
      description: 按技能标识返回 /.well-known/skills/{name}/SKILL.md，供发现协议按 url 拉取
      parameters:
      - description: 技能标识
        in: path
        name: name
        required: true
        type: string
      produces:
      - text/markdown
      responses:
        "200":
          description: SKILL.md
          schema:
            type: string
        "404":
          description: 技能不存在
          schema:
            $ref: '#/definitions/common.BaseResponse'
        "500":
          description: 读取技能失败
          schema:
            $ref: '#/definitions/common.BaseResponse'
      summary: '[公开] 读取技能原文'
      tags:
      - 插件接口
  /.well-known/skills/index.json:
    get:
      description: 输出 /.well-known/skills/index.json，供 npx skills add <origin> 探测本站技能
      produces:
      - application/json
      responses:
        "200":
          description: 技能发现清单
          schema:
            $ref: '#/definitions/plugin.WellKnownIndex'
        "500":
          description: 技能发现清单生成失败
          schema:
            $ref: '#/definitions/common.BaseResponse'
      summary: '[公开] 技能发现清单'
      tags:
      - 插件接口
  /api/v1/apikey:
    get:
      consumes:
      - application/json
      description: 按 page/size 分页查询 API 密钥列表，密钥以脱敏形式展示
      parameters:
      - description: Bearer Access Token
        in: header
        name: Authorization
        required: true
        type: string
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量（最大200）
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功，密钥脱敏展示
          schema:
            allOf:
            - $ref: '#/definitions/common.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/xModels.PageResponse-array_apikey_ApikeyItem'
              type: object
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/common.BaseResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/common.BaseResponse'
      summary: '[管理] 分页获取API密钥列表'
      tags:
      - API密钥接口
    post:
      consumes:
      - application/json
      description: 提交名称与可选描述/过期时间创建 API 密钥，返回完整密钥（仅此一次）
      parameters:
      - description: Bearer Access Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 创建请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apikey.CreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功，返回完整密钥（仅此一次）
          schema:
            allOf:
            - $ref: '#/definitions/common.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/apikey.CreateResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.BaseResponse'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/common.BaseResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/common.BaseResponse'
      summary: '[管理] 创建API密钥'
      tags:
      - API密钥接口
  /api/v1/apikey/{id}:
    delete:
      consumes:
      - application/json
      description: 根据密钥 ID 删除指定的 API 密钥，删除后不可恢复
      parameters:
      - description: Bearer Access Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: API密钥ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/common.BaseResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.BaseResponse'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/common.BaseResponse'
        "404":
          description: 密钥不存在
          schema:
            $ref: '#/definitions/common.BaseResponse'
      summary: '[管理] 删除API密钥'
      tags:
      - API密钥接口
    get:
      consumes:
      - application/json
      description: 根据密钥 ID 查询单个 API 密钥详情，密钥以脱敏形式展示
      parameters:
      - description: Bearer Access Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: API密钥ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功，密钥脱敏展示
          schema:
            allOf:
            - $ref: '#/definitions/common.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/apikey.DetailResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.BaseResponse'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/common.BaseResponse'
        "404":
          description: 密钥不存在
          schema:
            $ref: '#/definitions/common.BaseResponse'
      summary: '[管理] 获取API密钥详情'
      tags:
      - API密钥接口
    put:
      consumes:
      - application/json
      description: 更新指定 ID 的 API 密钥信息（名称、描述、过期时间、启用状态，字段可选）
      parameters:
      - description: Bearer Access Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: API密钥ID
        in: path
        name: id
        required: true
        type: string
      - description: 更新请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apikey.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/common.BaseResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.BaseResponse'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/common.BaseResponse'
        "404":
          description: 密钥不存在
          schema:
            $ref: '#/definitions/common.BaseResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/common.BaseResponse'
      summary: '[管理] 更新API密钥'
      tags:
      - API密钥接口
  /api/v1/apikey/{id}/reset:
    post:
      consumes:
      - application/json
      description: 根据密钥 ID 重置密钥，生成新密钥并返回完整密钥（仅此一次）
      parameters:
      - description: Bearer Access Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: API密钥ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 重置成功，返回新完整密钥（仅此一次）
          schema:
            allOf:
