# Docker 构建与 Release 发布流水线（GitHub Actions 驱动，本机不执行打包）
#
# 发布门禁: preflight 先校验版本连续性；失败后清理本次 tag，后续作业全部跳过。
# verify 再跑 make check（gofmt / go vet / go test -race），通过后才能构建。
# publish 执行单次前端构建与 Go 模块预热，由 GoReleaser 多系统打包后直接将二进制移交 Docker 构建 Multi-Arch 镜像，消灭重复构建。
#
# 触发方式:
#   make publish VERSION=vX.Y.Z（或 make public）      # 推送代码 + 推送版本 tag 触发本流水线
#   推送版本 tag（vX.Y.Z 或 vX.Y.Z-通道.N）             # 预检、校验、构建发布全平台二进制并推送镜像
#   make docker-build VERSION=v0.1.0                 # 手动触发，仅构建并推送镜像（不发 Release）
#   workflow_dispatch 手动触发                         # 可选：手动触发镜像构建与发布
#
# 版本语义:
#   版本号含 "-"（如 v0.1.1-beta.1 / v0.2.0-alpha.1）→ 发布为 prerelease，镜像额外打 beta-latest tag
#   其余（如 v0.1.0）                                → 正式 Release，镜像额外打 latest tag
#
# 前置条件:
#   Secrets: DOCKERHUB_USERNAME、DOCKERHUB_TOKEN、AI_API_KEY
# AI 固定使用 glm-5.3-flash / https://ai-intl.x-lf.com/v1。
# AI 配置缺失或调用失败时，Release 正文会回退为 commit 清单。
# 发版失败时会删除本次提交对应的远端 tag；若 tag 已被移动则拒绝删除。
# 注意: workflow_dispatch 只能从默认分支（master）触发，首次落地需先提交至 master
# GITHUB_TOKEN 创建 Release 附带的 tag 不会再次触发本工作流，避免重复打包。
name: Docker Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号，如 v0.1.0 或 v0.1.1-beta.1（预发布序号必须连续）'
        required: true
        type: string
      publish:
        description: '构建完成后创建 GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write # 创建 Release / Git Tag（Docker Hub 推送走 DOCKERHUB_TOKEN，无需 packages）

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: 发布版本预检
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.value }}
      remote-tag-existed: ${{ steps.tag-state.outputs.remote-existed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${{ github.ref_name }}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Check remote tag state
        id: tag-state
        run: |
          version="${{ steps.version.outputs.value }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null 2>&1; then
            echo "remote-existed=true" >> "$GITHUB_OUTPUT"
          else
            echo "remote-existed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check consecutive release version
        run: git tag --list 'v*' | go run ./scripts/check_release_version.go "${{ steps.version.outputs.value }}"

  verify:
    name: 打包校验
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go check
        uses: ./.github/actions/go-check

  publish:
    name: 构建发布与镜像推送
    needs:
      - preflight
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare local release tag
        run: |
          version="${{ needs.preflight.outputs.version }}"
          git rev-parse -q --verify "refs/tags/${version}^{commit}" >/dev/null || git tag "$version" HEAD

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Pre-download Go modules
        run: go mod download

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build embedded frontends
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter ./web build
          pnpm --filter ./web-wiki build

      - name: Compute Docker metadata
        id: meta
        run: |
          image="${{ secrets.DOCKERHUB_USERNAME }}/lumina"
          version="${{ needs.preflight.outputs.version }}"
          tags="$image:$version"
          prerelease="false"
          if [[ "$version" == *-* ]]; then
            prerelease="true"
            tags="$tags,$image:beta-latest"
          else
            tags="$tags,$image:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Generate AI release notes
        if: github.event_name == 'push' || inputs.publish
        env:
          AI_BASE_URL: https://ai-intl.x-lf.com/v1
          AI_MODEL: glm-5.3-flash
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          go run ./scripts/release_notes \
            --tag "${{ needs.preflight.outputs.version }}" \
            --out /tmp/release-notes.md

      - name: Run GoReleaser (Release)
        if: github.event_name == 'push' || inputs.publish
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --parallelism=2 --release-notes=/tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ needs.preflight.outputs.version }}

      - name: Ensure release notes populated
        if: github.event_name == 'push' || inputs.publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.version }}
        run: |
          if [ -f /tmp/release-notes.md ]; then
            gh release edit "$RELEASE_TAG" -R "${{ github.repository }}" --notes-file /tmp/release-notes.md
            echo "::notice::GitHub Release 正文已强保同步更新"
          fi

      - name: Run GoReleaser (Build only)
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.2
          args: build --clean --parallelism=2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ needs.preflight.outputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup-failed-tag:
    name: 清理失败发版 Tag
    if: >-
      always() &&
      (needs.preflight.result == 'failure' || needs.verify.result == 'failure' || needs.publish.result == 'failure') &&
      (github.event_name == 'push' || needs.preflight.outputs.remote-tag-existed == 'false')
    needs:
      - preflight
      - verify
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Delete failed release tag
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if [ -z "$RELEASE_VERSION" ]; then
            echo "::notice::本次失败发生在创建 tag 之前，无需清理"
            exit 0
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "::notice::远端 tag ${RELEASE_VERSION} 已不存在，无需清理"
            exit 0
          fi

          expected_sha=$(git rev-parse HEAD)
          git fetch --force origin "refs/tags/${RELEASE_VERSION}:refs/tags/${RELEASE_VERSION}"
          actual_sha=$(git rev-list -n 1 "$RELEASE_VERSION")
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "::error::拒绝删除 tag ${RELEASE_VERSION}：它指向 ${actual_sha}，本次流水线提交为 ${expected_sha}"
            exit 1
          fi

          git push origin ":refs/tags/${RELEASE_VERSION}"
          echo "::notice::发版失败，已删除远端 tag ${RELEASE_VERSION}"
