# Pull Request 只跑打包前校验（gofmt / go vet / go test -race），不构建镜像。
# 镜像与 Release 仍只在版本 tag 或 make docker-build / make publish 时走 docker-publish.yml，
# 且必须先通过同一个校验。
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 打包校验
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go check
        uses: ./.github/actions/go-check
