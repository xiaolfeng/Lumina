name: Go check
description: 打包前校验。发布版本规则测试、gofmt、go vet、go test -race。PR 与发版共用。

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    # PR checkout 不含前端构建产物，go:embed all:web*/dist 需要至少一个文件才能编译。
    # 正式发版路径（docker-build / GoReleaser 前置构建）不受影响，仍嵌入真实产物。
    - name: Ensure embedded dist placeholders
      shell: bash
      run: |
        mkdir -p resources/web/dist resources/web-wiki/dist
        touch resources/web/dist/index.html resources/web-wiki/dist/index.html

    - name: release version rules / gofmt / vet / race
      shell: bash
      run: make check
