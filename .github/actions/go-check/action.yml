name: Go check
description: 打包前校验。发布版本规则测试、gofmt、go vet、go test -race。PR 与发版共用。

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: release version rules / gofmt / vet / race
      shell: bash
      run: make check
